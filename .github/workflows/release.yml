name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Required secrets:
#   API_URL            — launcher API base URL baked into the build
#   API_TOKEN          — launcher API token baked into the build
#   RELEASE_TOKEN      — fine-grained PAT (Contents: read/write) belonging to a
#                        user in the repo's branch ruleset bypass list. Used by
#                        the bump job to push the version commit directly to
#                        `main`, since the default `GITHUB_TOKEN` is not in the
#                        bypass list and the ruleset requires PRs for direct
#                        pushes.
#
# Optional secrets:
#   MOJANG_CLIENT_ID   — Azure AD application id baked into the build to enable
#                        the "Sign in with Microsoft" button. Without it, the
#                        Yggdrasil-account login still works but MS sign-in fails
#                        with a generic error.
#   NETWORK_API_URL    — base URL of the Loontail in-game network service baked
#                        into the build for the embedded network agent. Without
#                        it the overlay ships but stays offline (no network).
#
# Loop guard: the bump commit (`chore(release): vX.Y.Z`) triggers this workflow
# again; the guard job short-circuits when the commit message begins with
# `chore(release):` so the release does not chain into itself.

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if echo "$MESSAGE" | grep -qE '^chore\(release\):'; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure required secrets are configured
        if: steps.check.outputs.proceed == 'true'
        env:
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          missing=()
          [ -z "$API_URL" ] && missing+=("API_URL")
          [ -z "$API_TOKEN" ] && missing+=("API_TOKEN")
          [ -z "$RELEASE_TOKEN" ] && missing+=("RELEASE_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}. Set them under Settings → Secrets and variables → Actions before pushing to main."
            exit 1
          fi

  bump:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT belongs to a repo admin (bypass list), so the push below
          # bypasses the "Require pull request" ruleset.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          version=$(npm version patch --no-git-tag-version)
          plain="${version#v}"
          tag="v${plain}"
          git add package.json package-lock.json
          git commit -m "chore(release): ${tag}"
          git tag "${tag}"
          git push origin HEAD:main
          git push origin "${tag}"
          echo "version=${plain}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        env:
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          MOJANG_CLIENT_ID: ${{ secrets.MOJANG_CLIENT_ID }}
          NETWORK_API_URL: ${{ secrets.NETWORK_API_URL }}
        run: npm run verify

      - name: Build & publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          MOJANG_CLIENT_ID: ${{ secrets.MOJANG_CLIENT_ID }}
          NETWORK_API_URL: ${{ secrets.NETWORK_API_URL }}
        run: npx electron-builder --win --publish always
