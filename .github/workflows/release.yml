name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Required secrets:
#   API_URL    — Strapi base URL baked into the build
#   API_TOKEN  — Strapi token baked into the build
#
# Loop guard: the bump commit ("chore(release): vX.Y.Z [skip release]") triggers
# this workflow again; the guard job exits if the marker is present.

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if echo "$MESSAGE" | grep -qE '\[skip release\]|^chore\(release\):'; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          version=$(npm version patch --no-git-tag-version)
          plain="${version#v}"
          tag="v${plain}"
          git add package.json package-lock.json
          git commit -m "chore(release): ${tag} [skip release]"
          git tag "${tag}"
          git push origin HEAD:main
          git push origin "${tag}"
          echo "version=${plain}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        env:
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: npm run verify

      - name: Build & publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: npx electron-builder --win --publish always
