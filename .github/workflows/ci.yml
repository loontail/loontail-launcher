name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Guards the removal of the dead API_TOKEN injection (finding S1, recorded
      # in docs/refactor/architecture-map.md). A build-time token here would be
      # baked into the shipped bundles by electron.vite.config.ts `define()` and
      # therefore extractable from any installer.
      - name: No build-time API token
        run: |
          if grep -rn 'API_TOKEN' src electron.vite.config.ts; then
            echo "::error::API_TOKEN must not be reintroduced — it would ship inside the installer."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Verify
        env:
          API_URL: ${{ vars.API_URL }}
          MOJANG_CLIENT_ID: ${{ vars.MOJANG_CLIENT_ID }}
          NETWORK_API_URL: ${{ vars.NETWORK_API_URL }}
        run: npm run verify
