# electron-updater config used only when running unpackaged builds.
# Production reads `publish` from electron-builder.yml. This file lets the
# updater code path run during `npm run dev` against a real GitHub release
# (or substitute provider) so the manual "Check" flow can be exercised.
#
# Keep `owner` / `repo` aligned with the production publish target.
provider: github
owner: loontail
repo: minecraft-launcher
updaterCacheDirName: minecraft-launcher-dev-updater
