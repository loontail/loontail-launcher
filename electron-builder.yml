appId: app.loontail.minecraft-launcher
productName: Loontail Minecraft Launcher
copyright: Copyright © 2026 Loontail
# Override the bundled package.json `name` to a flat identifier — Windows
# install paths and electron-updater cache directories pick this up.
extraMetadata:
  name: loontail-launcher
directories:
  output: dist
# Only what `out/main` still requires at runtime may live in package.json
# `dependencies`: electron-builder packs every one of them (and electron-vite's
# externalizeDepsPlugin keeps them out of the bundles). Renderer packages are
# bundled into out/renderer and stay devDependencies, so they never land here.
files:
  - out/**/*
  - package.json
  - "!**/.vscode/*"
  - "!**/{.eslintrc*,.prettierrc*,.editorconfig,.gitignore,.gitattributes}"
  - "!**/{tsconfig*,biome.json,vitest.config*}"
  # electron-builder collects node_modules with a bare `**/*` pattern — none of
  # the default exclusions that strip sources from the app's own files apply
  # there, so sourcemaps and TypeScript sources have to be dropped by hand.
  - "!**/node_modules/**/*.{map,ts,mts,cts,tsx}"
  # better-sqlite3 is reached only through the compiled binary. Everything else
  # is node-gyp input/output: the SQLite C amalgamation (deps), the addon sources
  # (src), MSVC link intermediates (build) and a prebuilt for another ABI (bin).
  - "!**/node_modules/better-sqlite3/{deps,src,bin,build}/**"
  - "**/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
  # `scripts/abi.mjs` keeps a node-ABI and an Electron-ABI build here so local
  # test/run switching is a file copy; packaging one of them would ship a binary
  # the app cannot load.
  - "!**/node_modules/better-sqlite3/.abi-cache/**"
  # @clack/prompts is minecraft-kit's optional dependency for the `mckit`
  # terminal UI; npm installs optional deps by default and the desktop app has
  # no way to reach it.
  - "!**/node_modules/@clack/**"
  # minecraft-kit is a dual-format package. `out/main` is CJS and requires the
  # bare specifier, so Node resolves the `require` condition (dist/index.cjs) and
  # the ESM twin plus the `./cli` subpath are dead weight. If the main bundle
  # ever becomes ESM, drop these two lines — startup would fail immediately.
  - "!**/node_modules/@loontail/minecraft-kit/dist/index.mjs"
  - "!**/node_modules/@loontail/minecraft-kit/dist/cli/**"
# better-sqlite3 is a native module: its compiled .node binary cannot be loaded
# from inside the asar archive, so unpack it. electron-builder rebuilds it for
# the Electron ABI during packaging (default npmRebuild).
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/bindings/**"
  - "**/node_modules/file-uri-to-path/**"
# Ship the bundled `authlib-injector` jar alongside the app so the launch path
# can resolve it at `process.resourcesPath/authlib-injector/`. The jar is
# gitignored and fetched from `AUTHLIB_INJECTOR_VERSION`; beforePack guarantees
# it is on disk however electron-builder was invoked. The AGPL notice rides
# along because a distributed copy of the jar must carry it.
beforePack: ./scripts/beforePack.mjs
extraResources:
  - from: vendor/authlib-injector
    to: authlib-injector
    filter:
      - "*.jar"
      - NOTICE.md
  # why extraResources rather than `files:`: attribution for the ~630 packages in
  # the dependency graph used to reach users only as a side effect of the raw
  # node_modules tree being packed into app.asar. `files:` above is already being
  # tightened; a notices file next to app.asar survives that, and the OFL font and
  # the app's own MIT grant are covered whatever the bundle ends up containing.
  # THIRD-PARTY-NOTICES.md is generated by beforePack (scripts/generateNotices.mjs).
  - from: LICENSE.md
    to: LICENSE.md
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  # Squirrel.Windows installs into %LOCALAPPDATA% and launches the app
  # immediately after extracting — no wizard, no admin prompt. Updates use
  # Electron's built-in `autoUpdater` (see `src/main/services/updater`) which
  # talks to `update.electronjs.org` and pulls the `RELEASES` + `.nupkg` from
  # this repo's GitHub Releases.
  target:
    - target: squirrel
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  target:
    - AppImage
  category: Game
publish:
  provider: github
  owner: loontail
  repo: minecraft-launcher
  releaseType: release
