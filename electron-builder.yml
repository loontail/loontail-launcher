appId: app.loontail.minecraft-launcher
productName: Loontail Minecraft Launcher
copyright: Copyright © 2026 Loontail
# Override the bundled package.json `name` to a flat identifier — Windows
# install paths and electron-updater cache directories pick this up.
extraMetadata:
  name: loontail-launcher
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/.vscode/*"
  - "!**/{.eslintrc*,.prettierrc*,.editorconfig,.gitignore,.gitattributes}"
  - "!**/{tsconfig*,biome.json,vitest.config*}"
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # oneClick + perMachine:false installs into %LOCALAPPDATA% silently and
  # launches the app immediately — same UX as Squirrel but without its
  # built-in updater (we use electron-updater). NSIS is what electron-updater
  # is best supported by: electron-builder bakes `app-update.yml` into
  # `resources/` and `latest.yml` is published alongside the installer.
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  target:
    - AppImage
  category: Game
publish:
  provider: github
  owner: loontail
  repo: minecraft-launcher
  releaseType: release
