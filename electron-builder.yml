appId: app.loontail.minecraft-launcher
productName: Loontail Minecraft Launcher
copyright: Copyright © 2026 Loontail
# Override the bundled package.json `name` to a flat identifier — Windows
# install paths and electron-updater cache directories pick this up.
extraMetadata:
  name: loontail-launcher
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/.vscode/*"
  - "!**/{.eslintrc*,.prettierrc*,.editorconfig,.gitignore,.gitattributes}"
  - "!**/{tsconfig*,biome.json,vitest.config*}"
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  # Squirrel.Windows installs into %LOCALAPPDATA% and launches the app
  # immediately after extracting — no wizard, no admin prompt. Updates use
  # Electron's built-in `autoUpdater` (see `src/main/services/updater`) which
  # talks to `update.electronjs.org` and pulls the `RELEASES` + `.nupkg` from
  # this repo's GitHub Releases.
  target:
    - target: squirrel
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  target:
    - AppImage
  category: Game
publish:
  provider: github
  owner: loontail
  repo: minecraft-launcher
  releaseType: release
