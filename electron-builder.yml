appId: app.loontail.minecraft-launcher
productName: Loontail Minecraft Launcher
copyright: Copyright © 2026 Loontail
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/.vscode/*"
  - "!**/{.eslintrc*,.prettierrc*,.editorconfig,.gitignore,.gitattributes}"
  - "!**/{tsconfig*,biome.json,vitest.config*}"
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  # Squirrel installs into %LOCALAPPDATA% and launches the app immediately
  # after extracting; no wizard, no admin elevation. Updates are driven by
  # electron-updater via the same GitHub Release that publishes
  # `RELEASES` + the `.nupkg` files.
  target:
    - target: squirrel
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  target:
    - AppImage
  category: Game
publish:
  provider: github
  owner: loontail
  repo: minecraft-launcher
  releaseType: release
